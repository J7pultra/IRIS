<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    #dropdown-wrapper {
      width: 100%;
      height: auto;
      max-height: 100vh;
      box-sizing: border-box;
      background: #141520;
      border-radius: 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .omnibox-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 14px;
      cursor: pointer;
      transition: background 0.12s ease, border-left 0.12s ease;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      user-select: none;
    }
    .omnibox-item:last-child {
      border-bottom: none;
    }
    .omnibox-item:hover,
    .omnibox-item.selected {
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.22), rgba(139, 92, 246, 0.08));
    }
    .omnibox-item.selected {
      border-left: 3px solid #818cf8;
      padding-left: 11px;
    }
    .omnibox-icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .omnibox-icon.search svg { color: #94a3b8; }
    .omnibox-icon.history svg { color: #38bdf8; }
    .omnibox-icon.bookmark svg { color: #fbbf24; }
    .omnibox-icon.switch-tab svg { color: #a855f7; }
    
    .omnibox-content {
      flex: 1;
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }
    .omnibox-title {
      font-weight: 500;
      font-size: 13px;
      color: #f1f5f9;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .omnibox-url {
      font-size: 11px;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .omnibox-action {
      font-size: 10px;
      font-weight: 600;
      color: #c084fc;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 2px 7px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="dropdown-wrapper"></div>

  <script>
    const wrapper = document.getElementById('dropdown-wrapper');

    function formatUrlForDisplay(url) {
      if (!url || url === 'about:blank') return '';
      try {
        const u = new URL(url);
        let formatted = u.hostname.replace(/^www\./, '') + u.pathname;
        if (formatted.endsWith('/')) formatted = formatted.slice(0, -1);
        return formatted;
      } catch (e) {
        return url;
      }
    }

    if (window.omniboxAPI) {
      window.omniboxAPI.onRenderSuggestions((data) => {
        wrapper.innerHTML = '';
        const suggestions = data.suggestions || [];
        const selectedIndex = data.selectedIndex;

        suggestions.forEach((item, index) => {
          const el = document.createElement('div');
          el.className = 'omnibox-item';
          if (index === selectedIndex) {
            el.classList.add('selected');
          }

          let iconSvg = '';
          let iconClass = item.type || 'search';

          if (item.type === 'switch-tab') {
            iconSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>`;
          } else if (item.type === 'bookmark') {
            iconSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`;
          } else if (item.type === 'history') {
            iconSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;
          } else {
            iconSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`;
          }

          const urlText = item.type !== 'search' ? formatUrlForDisplay(item.url) : '';
          const actionHtml = item.type === 'switch-tab' ? `<div class="omnibox-action">Ir a pestaña</div>` : '';

          el.innerHTML = `
            <div class="omnibox-icon ${iconClass}">${iconSvg}</div>
            <div class="omnibox-content">
              <span class="omnibox-title">${item.title}</span>
              ${urlText ? `<span class="omnibox-url">${urlText}</span>` : ''}
            </div>
            ${actionHtml}
          `;

          el.addEventListener('mousedown', (e) => {
            e.preventDefault();
            window.omniboxAPI.sendAction(index);
          });

          wrapper.appendChild(el);
        });
      });

      window.omniboxAPI.sendReady();
    }
  </script>
</body>
</html>
