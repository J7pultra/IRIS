<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-elevated:    #12141d;
      --accent-cyan:    #10b981;
      --text-primary:   #f1f5f9;
      --text-secondary: #94a3b8;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    .hover-card {
      background: #181a24;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      width: 260px;
      height: 90px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      opacity: 0;
      transform: translateY(3px);
      animation: fade-in 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      color: var(--text-primary);
    }
    @keyframes fade-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .hover-card-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .hover-card-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hover-card-domain {
      font-size: 11px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hover-card-memory {
      display: flex;
      align-items: center;
      gap: 7px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 6px;
      margin-top: 2px;
    }
    .hover-card-icon {
      width: 14px;
      height: 14px;
      color: #10b981;
      flex-shrink: 0;
    }
    .hover-card-memory-text {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .hover-card-memory-text strong {
      color: #10b981;
      font-weight: 600;
    }
    .hibernated-badge {
      display: inline-block;
      font-size: 10px;
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="hover-card">
    <div class="hover-card-info">
      <div class="hover-card-title" id="hover-card-title">Nueva pestaña</div>
      <div class="hover-card-domain" id="hover-card-domain"></div>
    </div>
    <div class="hover-card-memory">
      <svg class="hover-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
      </svg>
      <span class="hover-card-memory-text" id="hover-card-memory-container">
        Uso de memoria: <strong id="hover-card-ram">0</strong> MB
      </span>
    </div>
  </div>
</body>
</html>
